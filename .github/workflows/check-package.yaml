name: R package and learning examples
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
      - name: Check the R package
        run: |
          R CMD build packages/causalgap
          R CMD check --no-manual causalgap_*.tar.gz
      - name: Reproduce the worked example
        run: |
          mkdir -p "$RUNNER_TEMP/r-library"
          R CMD INSTALL --library="$RUNNER_TEMP/r-library" causalgap_*.tar.gz
          R_LIBS_USER="$RUNNER_TEMP/r-library" Rscript --vanilla docs/examples/hybrid-eif.R
      - name: Check the interactive calculations
        run: |
          node analysis/validation/check_interactive_labs.js
          node analysis/validation/check_eif_models.js
      - name: Install replication dependencies
        shell: Rscript {0}
        run: |
          packages <- c("jsonlite", "digest", "data.table")
          install.packages(packages, repos = "https://cloud.r-project.org")
          stopifnot(all(vapply(packages, requireNamespace, logical(1), quietly = TRUE)))
      - name: Run independent validation and two-worker refits
        shell: Rscript {0}
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          source("analysis/reproduce.R")
          reproduce("validate")
          reproduce("smoke", workers = 2L)
          completed <- function(path) "Status: completed" %in% readLines(file.path(path, "run-completed.txt"))
          stages <- c("baseline", "oracle", "extended", "quadratic")
          stopifnot(completed(file.path("results", "validate")),
                    all(vapply(file.path("results", "smoke", stages), completed, logical(1))))
          marker <- function(...) jsonlite::read_json(file.path("results", "smoke", ...), simplifyVector = TRUE)
          baseline <- marker("baseline", "validation.json")
          oracle <- marker("oracle", "protocol.json")$validation
          extended <- marker("extended", "validation.json")
          quadratic <- marker("quadratic", "quadratic_rct_protocol.json")
          stopifnot(isTRUE(baseline$success), identical(as.integer(baseline$repetitions_per_size), 4L),
                    identical(as.integer(baseline$failures), 0L),
                    identical(as.integer(oracle$paired_datasets), 4L),
                    identical(as.integer(oracle$failures), 0L),
                    isTRUE(extended$success), identical(as.integer(extended$paired_datasets), 16L),
                    identical(as.integer(extended$failures), 0L),
                    identical(as.integer(quadratic$repetitions_per_size), 4L),
                    identical(as.integer(quadratic$samples_hashed), 8L),
                    identical(as.integer(quadratic$portable_hash_matches), 8L),
                    identical(as.integer(quadratic$local_baseline_raw_hash_matches), 8L))
      - name: Reproduce the numbered exhibits in R
        shell: Rscript {0}
        run: |
          source("analysis/reproduce.R")
          reproduce("tables")
          reproduce("figures")
          stopifnot(length(list.files("results/tables", pattern = "[.]csv$")) == 15L)
          figures <- read.csv("results/figures/figure-index.csv")
          expected <- sprintf("Figure-%s%02d.pdf", rep(c("", "S"), c(11, 12)), c(1:11, 1:12))
          stopifnot(!anyDuplicated(figures$pdf), setequal(basename(figures$pdf), expected),
                    all(file.exists(file.path("results/figures", expected))))
          source("docs/examples/model-reductions.R")
      - name: Verify aggregate inputs and finite-law identities
        run: |
          Rscript analysis/validation/verify_package.R
          Rscript analysis/validation/theory_algebra_check.R
